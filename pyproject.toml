[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jetio-ratelimit"
version = "0.1.1"
description = "Rate limiting plugin for the Jetio framework -- sliding-window, IP/account-keyed, middleware and Depends()-composable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Stephen Burabari Tete", email = "cehtete@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
]
dependencies = [
    "jetio>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/cehstephen/jetio-ratelimit"
"Bug Tracker" = "https://github.com/cehstephen/jetio-ratelimit/issues"

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx", "uvicorn", "jetio-auth>=0.2.4"]

[tool.setuptools.packages.find]
include = ["jetio_ratelimit*"]

[tool.coverage.run]
source = ["jetio_ratelimit"]
# Scenario apps in tests_e2e run as real subprocesses (real uvicorn, real
# TCP) rather than in-process -- coverage.py can't see into a child process
# unless it's launched under `coverage run --parallel-mode` itself (see
# tests_e2e/conftest.py). `parallel = true` makes pytest-cov auto-discover
# and merge those subprocess .coverage.* data files into the main report.
parallel = true
