name: Python tests
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install deps + project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify import
        run: python -c "import jetio_ratelimit; print(jetio_ratelimit.__file__)"
      - name: Run unit tests with coverage
        run: pytest tests/ --cov=jetio_ratelimit
      - name: DEBUG does any atexit hook fire after uvicorn SIGTERM shutdown
        run: |
          rm -f /tmp/atexit_ran.txt
          cat > /tmp/tinyserver2.py <<'EOF'
          import atexit
          def _mark():
              with open("/tmp/atexit_ran.txt", "w") as f:
                  f.write("yes")
          atexit.register(_mark)
          import uvicorn
          from starlette.applications import Starlette
          from starlette.responses import PlainTextResponse
          from starlette.routing import Route
          async def home(request):
              return PlainTextResponse("ok")
          app = Starlette(routes=[Route("/", home)])
          if __name__ == "__main__":
              uvicorn.run(app, host="127.0.0.1", port=8999)
          EOF
          python /tmp/tinyserver2.py &
          SERVER_PID=$!
          sleep 3
          echo "sending SIGTERM to $SERVER_PID"
          kill -TERM $SERVER_PID
          wait $SERVER_PID || echo "exit code: $?"
          cat /tmp/atexit_ran.txt 2>&1 || echo "ATEXIT NEVER RAN"
      - name: Run end-to-end scenario tests with coverage
        # Real subprocess-launched scenario apps over real HTTP (see DESIGN.md) --
        # kept as a separate step so a failure here is never confused with a
        # unit test failure in CI's summary. --cov-append keeps this step's
        # coverage (including the scenario apps' own subprocess data, merged
        # in automatically by pytest-cov via [tool.coverage.run] parallel=true
        # -- see tests_e2e/conftest.py) on top of the unit tests' coverage
        # rather than overwriting it.
        run: pytest tests_e2e/ --cov=jetio_ratelimit --cov-append
      - name: Generate coverage report
        run: coverage xml
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
