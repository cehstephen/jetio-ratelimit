name: Python tests
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install deps + project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify import
        run: python -c "import jetio_ratelimit; print(jetio_ratelimit.__file__)"
      - name: Run unit tests with coverage
        run: pytest tests/ --cov=jetio_ratelimit --cov-report=xml
      - name: Run end-to-end scenario tests
        # Real subprocess-launched scenario apps over real HTTP (see DESIGN.md) --
        # kept as a separate step so a failure here is never confused with a
        # unit test failure in CI's summary.
        run: pytest tests_e2e/
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
